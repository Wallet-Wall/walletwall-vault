name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history (not the default shallow depth-1 clone): the deployment-truth
          # reproducibility validator (npm run validate:reproducibility) independently
          # verifies each manifest's reportedSourceCommit is real, reachable git history
          # via local `git merge-base --is-ancestor`, and re-verifies each build capture's
          # sourceDigests against that commit's actual git objects via `git show` — both
          # need the historical commit's objects present locally. No network fetch is
          # performed by the validator itself; this checkout step is what makes the
          # objects available for it to read.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # The Hardhat 3 CLI requires Node >= 22.13.0 (its MIN_SUPPORTED_NODE_VERSION).
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm run security:audit

      - name: Compile contracts
        run: npm run compile

      - name: Validate runtime bytecode size (EIP-170 budget; deterministic, no network)
        run: |
          set -euo pipefail
          # Cheap, deterministic check: every measured contract's RUNTIME (deployed)
          # bytecode is within the EIP-170 24,576-byte protocol ceiling. Creation
          # bytecode is reported but never gated. No network, no chain, no proving.
          npm run validate:bytecode-size

      - name: Validate runtime-byte claims against the compiler (deterministic, no network)
        run: |
          set -euo pipefail
          # Every published claim about a contract's RUNTIME bytecode size — the
          # reproducibility manifests' publicHeadRuntimeBytes, the evidence bundles'
          # captured public-HEAD build, and the README / SECURITY.md / docs/Deployments.md
          # prose — must equal the size solc just produced. Reuses the same measurement
          # primitive as the EIP-170 step above; never compares one record to another,
          # because two records agreeing is not evidence when both are hand-refreshed.
          # Read-only: --write (refresh) is a deliberate local action, never a CI step.
          npm run validate:runtime-byte-claims

      - name: Validate SP1 pin parity (deterministic; no SP1 toolchain, no cargo, no network)
        run: |
          set -euo pipefail
          # zkvm/host/Cargo.toml's own version note: sp1-zkvm (guest), sp1-sdk and
          # sp1-build (host) must name the SAME SP1 release — "If you bump one, bump
          # all three together, then re-extract the program vKey." Nothing else here
          # would catch a split: zkvm/host is deliberately outside CI, the
          # "Validate SP1 host Cargo.lock" job checks that lockfile's own internal
          # consistency and never guest-vs-host parity, the TS<->Rust differential
          # test is skipped, and no ELF or vKey is committed whose drift would show
          # it. Pure Cargo.toml text inspection, so it runs here even though the host
          # crate itself cannot. Proves the DECLARED releases agree — not that the
          # release builds or proves correctly (see docs/ZK_Prover_Runbook.md).
          npm run validate:sp1-pin-parity

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Lint contracts
        run: npm run lint

      - name: Install stable Rust (native guest executor)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build the native guest executor for the relation consumer tests (no SP1 toolchain)
        run: |
          set -euo pipefail
          # test/ZKMLDSAWithdrawalRelationConsumers.test.ts runs the guest programs' own
          # sources natively (zkvm/relation-tests, bin guest-native-execute) to learn which
          # journals a program can commit, then drives the vault, MultiSig and policy-control
          # consumers with exactly those proofs. Under CI it fails instead of skipping when
          # SP1_RELATION_EXECUTOR is unset; the Coverage step below reuses the same binary.
          # Stable Rust only: no SP1 toolchain, no proving.
          cargo build --locked --manifest-path zkvm/relation-tests/Cargo.toml --bin guest-native-execute
          echo "SP1_RELATION_EXECUTOR=$GITHUB_WORKSPACE/zkvm/relation-tests/target/debug/guest-native-execute" >> "$GITHUB_ENV"

      - name: Run tests
        run: npm test

      - name: Smoke-test shipped CLIs
        run: |
          set -euo pipefail
          # Verifier CLI: verifies a valid fixture triple and prints JSON.
          out=$(npm run --silent verifier:verify -- \
            --message-file test/fixtures/mldsa/library-generated/message.hex \
            --public-key-file test/fixtures/mldsa/library-generated/public-key.hex \
            --pq-signature-file test/fixtures/mldsa/library-generated/signature.hex \
            --json)
          echo "$out"
          echo "$out" | grep -q '"reason": "ML_DSA_65_VALID"'
          # Attestor demo: exercises the off-chain verify + EIP-712 signing path.
          # Both CLIs are TypeScript run through tsx (see their npm scripts) on the pinned Node 22.
          npm run attestor:demo

      - name: SP1 smoke (execute-only journal check; no SP1 toolchain)
        run: |
          set -euo pipefail
          # Cheap, deterministic SP1 lane check: derives the guest journal for a
          # fixture and asserts its shape. No proving; the host execute step is
          # skipped here because CI has no built mldsa65-host binary. Heavy
          # proving / e2e stays gated behind RUN_SP1_E2E=1.
          out=$(npm run --silent sp1:smoke)
          echo "$out"
          echo "$out" | grep -q '"mode": "sp1-smoke"'
          echo "$out" | grep -q '"proven": false'
          echo "$out" | grep -q '"hostExecuted": false'

      - name: Validate deployment metadata (deterministic; no network)
        run: |
          set -euo pipefail
          # Cheap, deterministic check: every committed deployment metadata record
          # under deployments/ (excluding schema/, examples/, reproducibility/)
          # conforms to the required shape and testnet-only safety rules. No
          # network, no chain, no proving.
          npm run validate:deployments

      - name: Validate deployment reproducibility manifests (deterministic; no network)
        run: |
          set -euo pipefail
          # Cheap, deterministic check: every committed reproducibility manifest
          # under deployments/reproducibility/ passes the honesty cross-check (a
          # manifest may only claim "reproducible" when its own recorded facts
          # support that) or carries a concrete remediation plan. No network, no
          # chain, no proving.
          npm run validate:reproducibility

      - name: Validate reproducible proof artifact (deterministic; no proving)
        run: |
          set -euo pipefail
          # Cheap, deterministic check: the committed proof-artifact manifest is
          # valid and has not drifted from its generator. No SP1 toolchain, no
          # proving, no network. Real proving stays gated behind RUN_SP1_E2E=1.
          npm run proof:artifact:validate

      - name: Validate ML-DSA evidence manifest (deterministic; no proving)
        run: |
          set -euo pipefail
          # Cheap, deterministic check: the committed ML-DSA evidence manifest is
          # valid, its recorded hashes match the artifacts it indexes, and it has
          # not drifted from its generator. No toolchain, no proving, no network.
          npm run validate:evidence

      - name: Validate SP1 proof input (deterministic; no proving)
        run: |
          set -euo pipefail
          # Cheap, deterministic check: the committed SP1 guest proof input is
          # well-formed, aligned with the ML-DSA evidence manifest hashes/schema,
          # and has not drifted. No SP1 toolchain, no proving, no network.
          npm run validate:sp1-input

      - name: Validate ZK verifier adapter boundary (deterministic; no proving)
        run: |
          set -euo pipefail
          # Cheap, deterministic check: the committed ZK verifier adapter is valid,
          # its journal decodes to the proof-input hashes, those hashes match the
          # ML-DSA evidence manifest, and it has not drifted. No SP1 toolchain, no
          # proving, no network.
          npm run validate:zk-adapter

      - name: Validate ZK adapter evidence endpoint response (deterministic; no server)
        run: |
          set -euo pipefail
          # Cheap, deterministic check: the committed read-only endpoint example
          # serves the committed adapter, its etag is keccak256 of that adapter, a
          # conditional GET returns 304, and it has not drifted. No server, no
          # network, no proving.
          npm run validate:zk-response

      - name: Validate static hosted evidence artifact (deterministic; no publish)
        run: |
          set -euo pipefail
          # Cheap, deterministic check: the committed Option A static hosted evidence
          # artifact is byte-for-byte the canonical example, is a valid
          # zk-adapter-evidence-response.v1, its etag is keccak256 of its adapter, it
          # is served from a versioned path, and it has not drifted from the
          # generator. Publishes nothing — no server, no network, no GitHub Pages
          # deploy, no CDN upload, no proving.
          npm run validate:static-artifact

      - name: Coverage
        run: npm run coverage

  zkvm-guest:
    name: Compile zkVM guest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Compile guest
        run: cargo check --manifest-path zkvm/guest/Cargo.toml

  zkvm-relation-tests:
    name: Native guest relation tests (no SP1 toolchain)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install stable Rust (with rustfmt)
        # The guest programs' own sources (zkvm/guest/src/bin) compiled for the host target
        # against a stand-in for the three sp1_zkvm items they use: no SP1 toolchain, no
        # prover, no network at test time. Cargo fetches the relation-test crate's locked
        # dependencies at build time.
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Format check
        run: cargo fmt --check --all --manifest-path zkvm/relation-tests/Cargo.toml

      - name: Relation tests — locked
        # The withdrawal program must verify exactly the digest it commits, under the empty
        # ML-DSA context, for every stdin layout a prover may choose; the ACVP conformance
        # program must remain a separate program. See zkvm/relation-tests/src/lib.rs.
        run: cargo test --locked --manifest-path zkvm/relation-tests/Cargo.toml

  zkvm-host-lockfile:
    name: Validate SP1 host Cargo.lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Verify host lockfile is committed and consistent
        # --locked fails if Cargo.lock is missing or out of date with Cargo.toml.
        # No compilation occurs; this only resolves metadata from the lockfile.
        run: cargo metadata --locked --no-deps --manifest-path zkvm/host/Cargo.toml

  evidence-validator:
    name: Check evidence-validator crate (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install stable Rust (with rustfmt)
        # Offline tooling crate: no SP1 toolchain, no prover, and no network/RPC,
        # chain, key, or endpoint behavior at runtime. Cargo fetches only serde +
        # serde_json + sha3 at build time (exactly like the zkvm-guest job). A
        # Cargo.lock IS committed for this crate, so `--locked` is used below for the
        # build/test steps to pin the exact dependency versions and fail on any
        # lockfile drift (mirroring the zkvm-host-lockfile job's reproducibility
        # gate). `cargo fmt` needs no dependency resolution, so it stays unchanged.
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Format check
        run: cargo fmt --check --manifest-path zkvm/evidence-validator/Cargo.toml

      - name: Type / borrow check (no proving, no network) — locked
        run: cargo check --locked --manifest-path zkvm/evidence-validator/Cargo.toml

      - name: Unit + negative tests (no proving, no network/RPC, no chain) — locked
        run: cargo test --locked --manifest-path zkvm/evidence-validator/Cargo.toml
