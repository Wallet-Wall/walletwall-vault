name: SP1 canonical build

# SP1-TD1's canonical procedure (PINNED_VENDOR_BUILD), rebuilt from the designated subject and compared with the
# designation (docs/SP1_Implementation_Pin_Designation_Registry.md):
#   changes          - decides from the diff whether an input of the canonical build changed
#                      (scripts/sp1-canonical/ci-gate.mjs: the subject, the designations and their evidence, the
#                      procedure, the driver, the checker and everything it imports, the packages, this workflow);
#   build            - when one did, on two GitHub-hosted runners (different runner images), each in a fresh container
#                      of the vendor image referenced BY DIGEST (taken from the designation, never a tag), SP1-TD1's
#                      preserved entrypoint run unchanged, the guest lockfile recorded before and after the build;
#   vkey-recompute   - on a third runner, from the ELF files only, with Succinct's released cargo-prove v6.3.1 verified
#                      against its published digest: the vkey recomputed outside every build;
#   compare          - scripts/check-sp1-canonical-build.ts: fails on ELF, vkey, lockfile, image, entrypoint, driver
#                      or subject drift, on a conflicting recompute, on an incomplete build, and on fewer than two
#                      distinct hosts; uploads the observation with its raw records, in the committed evidence's layout;
#   gate             - "SP1 canonical build gate": always runs, and passes only when every job the change requires
#                      passed (a job skipped because the rebuild was required and something failed is no pass).
# The workflow runs for every pull request, so its gate can be required without leaving unrelated pull requests
# pending (a path filter would); the matrix job is held back by step conditions, never a job-level if:. Requiring the
# gate is the owner's ruleset change. The cheap check (the subject on disk and at HEAD is the designation's) runs on
# every pull request in ci.yml through npm run validate:sp1-designation. Common mode, by construction: one image, one
# toolchain, one source archive, one entrypoint, one crate set, one operator; the recompute is the same upstream
# prover library in another binary distribution.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: SP1 canonical build inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      rebuild: ${{ steps.decide.outputs.rebuild }}
    steps:
      - name: Checkout repository (full history, for the diff)
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Decide whether an input of the canonical build changed
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/sp1-canonical/ci-gate.mjs changed

  build:
    name: Canonical build (${{ matrix.runner }})
    needs: changes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: ubuntu-22.04
    steps:
      - name: Checkout repository
        if: needs.changes.outputs.rebuild == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js (reads the designation)
        if: needs.changes.outputs.rebuild == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Free runner disk for the 7 GB vendor image
        if: needs.changes.outputs.rebuild == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune -af > /dev/null
          df -h /

      - name: Canonical build of the designated subject (vendor image by digest)
        if: needs.changes.outputs.rebuild == 'true'
        run: bash scripts/sp1-canonical/canonical-build.sh "$RUNNER_TEMP/canonical" "github-${{ matrix.runner }}"

      - name: Upload the build's record and ELFs
        if: always() && needs.changes.outputs.rebuild == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: canonical-build-${{ matrix.runner }}
          path: ${{ runner.temp }}/canonical
          retention-days: 90
          if-no-files-found: error

  vkey-recompute:
    name: Recompute the vkey outside the build
    needs: [changes, build]
    if: needs.changes.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download the builds
        uses: actions/download-artifact@v4
        with:
          pattern: canonical-build-*
          path: builds

      - name: Released cargo-prove v6.3.1, verified against its published digest
        run: |
          set -euo pipefail
          curl -fsSL -o cargo-prove.tar.gz \
            https://github.com/succinctlabs/sp1/releases/download/v6.3.1/cargo_prove_v6.3.1_linux_amd64.tar.gz
          echo "c9d6ee7667fa9e0a2302324a6bb0295c55f6acf0e17a242ad11ee45767bb08df  cargo-prove.tar.gz" | sha256sum -c -
          mkdir -p tool
          tar -xzf cargo-prove.tar.gz -C tool
          bin="$(find tool -type f -name cargo-prove | head -1)"
          test -n "$bin"
          chmod +x "$bin"
          echo "CARGO_PROVE=$PWD/$bin" >> "$GITHUB_ENV"

      - name: Recompute each ELF's vkey (the ELF files only; no source, no build environment)
        run: |
          set -euo pipefail
          mkdir -p recompute
          tool_sha256="$(sha256sum "$CARGO_PROVE" | cut -d' ' -f1)"
          tool_version="$("$CARGO_PROVE" prove --version)"
          os_name="$(. /etc/os-release && echo "$PRETTY_NAME")"
          kernel="$(uname -srm)"
          for runner in ubuntu-24.04 ubuntu-22.04; do
            build="builds/canonical-build-$runner"
            record="recompute/canonical-build-$runner.txt"
            {
              echo "tool_sha256=$tool_sha256"
              echo "tool_version=$tool_version"
              echo "ran_on=$kernel $os_name github-hosted $RUNNER_NAME"
            } > "$record"
            for p in mldsa65-withdrawal mldsa65-acvp; do
              elf="$build/elf/$p"
              test -s "$elf" || { echo "$elf is missing: the build on $runner did not produce it" >&2; exit 1; }
              elf_sha256="$(sha256sum "$elf" | cut -d' ' -f1)"
              vkey_output="$("$CARGO_PROVE" prove vkey --elf "$elf" 2>&1 | tail -3 | tr '\n' ' ')"
              echo "elf_${p}_sha256=$elf_sha256" >> "$record"
              echo "vkey_output_${p}=$vkey_output" >> "$record"
            done
            cat "$record"
          done

      - name: Upload the recompute records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vkey-recompute
          path: recompute
          retention-days: 90
          if-no-files-found: error

  compare:
    name: Compare with the designation
    needs: [changes, build, vkey-recompute]
    if: needs.changes.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download the builds and recomputes
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compare every host and the recompute with the designation (two hosts required)
        run: |
          set -euo pipefail
          npx tsx scripts/check-sp1-canonical-build.ts \
            --build github-ubuntu-24.04=artifacts/canonical-build-ubuntu-24.04 \
            --build github-ubuntu-22.04=artifacts/canonical-build-ubuntu-22.04 \
            --recompute artifacts/vkey-recompute/canonical-build-ubuntu-24.04.txt \
            --recompute artifacts/vkey-recompute/canonical-build-ubuntu-22.04.txt \
            --min-hosts 2 \
            --records "$RUNNER_TEMP/canonical-rebuild-github"

      - name: Upload the observation and its raw records (the committed evidence's layout)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-rebuild-evidence
          path: |
            ${{ runner.temp }}/canonical-rebuild-github.raw.json
            ${{ runner.temp }}/canonical-rebuild-github
          retention-days: 90
          if-no-files-found: error

  gate:
    name: SP1 canonical build gate
    needs: [changes, build, vkey-recompute, compare]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the decision script
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/sp1-canonical

      - name: Every job the change requires passed
        env:
          REBUILD: ${{ needs.changes.outputs.rebuild }}
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
          RECOMPUTE: ${{ needs.vkey-recompute.result }}
          COMPARE: ${{ needs.compare.result }}
        run: node scripts/sp1-canonical/ci-gate.mjs gate
